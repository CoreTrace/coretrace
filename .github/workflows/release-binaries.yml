# SPDX-License-Identifier: Apache-2.0
name: Build Release Binaries

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_BASENAME: coretrace
  RELEASE_BINARY: ctrace

jobs:
  build-linux-binaries:
    name: Build Linux binary (${{ matrix.arch }})
    # Each architecture builds on a native runner: emulating arm64 through QEMU on an
    # x86 host took about 25 minutes for the LLVM-linked analyzer, native takes a few.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve artifact version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="sha-${short_sha}"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The toolchain image and the compiled Python analyzer change rarely: they are kept in the
      # GitHub Actions cache between runs, written by this step, which builds nothing else, so that
      # the cache holds no layer of CoreTrace's own build. The full build below reads them from
      # the cache. A tag builds everything afresh, so that a release ships the latest package
      # updates.
      - name: Build the toolchain image, from the cache when unchanged
        if: github.ref_type != 'tag'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release-binaries
          target: toolchain
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=release-toolchain-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-toolchain-${{ matrix.arch }}
          outputs: type=cacheonly
          provenance: false

      # The toolchain step above only resolves the cached layers, without loading them into the
      # builder: this build must read the same cache to reuse them, and the GitHub Actions cache
      # is only reachable from an action, not from a docker command in a run step.
      - name: Build packaged binary with Buildx
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release-binaries
          target: artifacts
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            PROJECT_NAME=${{ env.RELEASE_BASENAME }}
            BINARY_NAME=${{ env.RELEASE_BINARY }}
          cache-from: ${{ github.ref_type != 'tag' && format('type=gha,scope=release-toolchain-{0}', matrix.arch) || '' }}
          outputs: type=local,dest=dist/${{ matrix.arch }}
          provenance: false

      - name: Validate artifact files
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="dist/${{ matrix.arch }}"
          ls -la "${artifact_dir}"
          archive="${artifact_dir}/${{ env.RELEASE_BASENAME }}-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}.tar.gz"
          checksum="${archive}.sha256"
          test -f "${archive}" || { echo "missing archive: ${archive}"; exit 1; }
          test -f "${checksum}" || { echo "missing checksum: ${checksum}"; exit 1; }
          (
            cd "${artifact_dir}"
            sha256sum -c "$(basename "${checksum}")"
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_BASENAME }}-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/*.tar.gz
            dist/${{ matrix.arch }}/*.sha256
          if-no-files-found: error

  publish-release-assets:
    name: Attach binaries to GitHub Release
    runs-on: ubuntu-24.04
    needs: build-linux-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      # A provenance attestation for each archive: the job's OIDC token obtains a signing
      # certificate, then the attestation and its storage record are kept by GitHub.
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.RELEASE_BASENAME }}-*-linux-*
          path: dist
          merge-multiple: true

      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist

      - name: Attest the provenance of the archives
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
