# SPDX-License-Identifier: Apache-2.0
name: Build

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            curl \
            ca-certificates \
            gnupg \
            cppcheck \
            patchelf
          sudo ./scripts/ci/install-llvm-apt.sh 20
          echo "LLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "Clang_DIR=/usr/lib/llvm-20/lib/cmake/clang" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install cmake ninja llvm@20 cppcheck
          echo "LLVM_DIR=$(brew --prefix llvm@20)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "Clang_DIR=$(brew --prefix llvm@20)/lib/cmake/clang" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"

      # coretrace-python-analyzer is compiled into a standalone executable with Nuitka, so the
      # tests exercise the real bundled tool (patchelf, above, is Nuitka's Linux requirement).
      - name: Set up Python for the bundled analyzer
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Nuitka
        run: |
          set -euo pipefail
          "${{ steps.python.outputs.python-path }}" -m pip install nuitka==4.2.2

      - name: Configure CMake
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DUSE_THREAD_SANITIZER=OFF \
            -DUSE_ADDRESS_SANITIZER=OFF \
            -DLLVM_DIR="${LLVM_DIR}" \
            -DClang_DIR="${Clang_DIR}" \
            -DENABLE_PYTHON_ANALYZER=ON \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build --config Release -j4

      - name: Smoke test
        run: |
          set -euo pipefail
          ./build/ctrace -h

      - name: Test
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure

      # The async proof harness drives cppcheck and the stack analyzer in both modes and
      # compares diagnostic fingerprints. The speed-up assertion is disabled: it is a timing
      # claim that a shared runner cannot make reliably, and the fingerprints are the point.
      - name: Async harness (F7)
        run: |
          set -euo pipefail
          python3 tests/BTP-STACK-ANALYZER-F7 --ctrace-bin ./build/ctrace \
            --iterations 1 --warmups 0 --min-speedup-ratio 0

  # How much of CoreTrace's own code the unit and the integration tests run: a table in the job
  # summary and the full report as an artifact (scripts/ci/coverage.sh). No threshold fails it.
  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            curl \
            ca-certificates \
            gnupg \
            cppcheck
          sudo ./scripts/ci/install-llvm-apt.sh 20
          # The profile runtime that -fprofile-instr-generate links (libclang_rt.profile.a).
          . ./scripts/ci/retry.sh
          retry 5 10 sudo apt-get install -y --no-install-recommends libclang-rt-20-dev

      # Source-based coverage needs Clang; only CoreTrace's own targets are instrumented.
      - name: Configure CMake
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCORETRACE_COVERAGE=ON \
            -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/llvm-20/lib/cmake/clang

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build -j4

      - name: Measure coverage
        env:
          LLVM_PROFDATA: /usr/lib/llvm-20/bin/llvm-profdata
          LLVM_COV: /usr/lib/llvm-20/bin/llvm-cov
        run: sh scripts/ci/coverage.sh build coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/*.txt
            coverage/summary.md
            coverage/html
